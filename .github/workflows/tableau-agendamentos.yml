name: Tableau - Relatorio de Agendamentos

on:
  schedule:
    # TODO: horário PROVISÓRIO — dia 1 de cada mês às 08:00 (horário de Brasília, UTC-3).
    # Ajustar assim que o controlador com o horário real for confirmado.
    # Lembrete: o cron do GitHub Actions é sempre em UTC.
    - cron: "0 11 1 * *"
  workflow_dispatch: {}

jobs:
  tableau-agendamentos:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tableau-agendamentos
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Rodar automação
        env:
          TABLEAU_EMAIL: ${{ secrets.TABLEAU_EMAIL }}
          TABLEAU_SENHA: ${{ secrets.TABLEAU_SENHA }}
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_FOLDER_TABLEAU_ID: ${{ secrets.GDRIVE_FOLDER_TABLEAU_ID }}
        run: python tableau_agendamentos.py --headless

      - name: Upload dos arquivos gerados / erro
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tableau-agendamentos-output
          path: tableau-agendamentos/downloads/**
          if-no-files-found: ignore
