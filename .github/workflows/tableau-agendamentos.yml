name: Tableau - Relatorio de Agendamentos

on:
  # WORKFLOW PAUSADO a pedido do usuário (19/08/2026) — sem runner
  # self-hosted disponível (sem cartão de crédito pra criar VM grátis) e
  # sem querer gastar minutos do GitHub Actions em repo privado. Nenhum
  # gatilho ativo: nem o botão "Run workflow" nem as chamadas do
  # cron-job.org disparam nada enquanto "on:" estiver vazio assim.
  #
  # Pra reativar: descomente "workflow_dispatch: {}" abaixo. Pra também
  # voltar o agendamento automático, descomente o bloco "schedule:"
  # (de hora em hora no minuto :29, 08h-18h BRT, seg-sáb =
  # "29 11-21 * * 1-6").
  # workflow_dispatch: {}
  # schedule:
  #   - cron: "29 11-21 * * 1-6"
  {}

permissions:
  contents: write

jobs:
  tableau-agendamentos:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: tableau-agendamentos
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Rodar automação (com retentativas, igual ao Controlador.py)
        env:
          TABLEAU_EMAIL: ${{ secrets.TABLEAU_EMAIL }}
          TABLEAU_SENHA: ${{ secrets.TABLEAU_SENHA }}
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_FOLDER_TABLEAU_ID: ${{ secrets.GDRIVE_FOLDER_TABLEAU_ID }}
          GDRIVE_IMPERSONATE_USER: ${{ secrets.GDRIVE_IMPERSONATE_USER }}
          GDRIVE_OAUTH_CLIENT_ID: ${{ secrets.GDRIVE_OAUTH_CLIENT_ID }}
          GDRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.GDRIVE_OAUTH_CLIENT_SECRET }}
          GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.GDRIVE_OAUTH_REFRESH_TOKEN }}
        run: |
          MAX_TENTATIVAS=3
          ESPERA_ERRO=60
          tentativa=1
          while [ "$tentativa" -le "$MAX_TENTATIVAS" ]; do
            echo "Tentativa $tentativa de $MAX_TENTATIVAS..."
            if python tableau_agendamentos.py --headless; then
              echo "Execução concluída com sucesso."
              exit 0
            fi
            echo "Falhou na tentativa $tentativa."
            if [ "$tentativa" -lt "$MAX_TENTATIVAS" ]; then
              echo "Aguardando ${ESPERA_ERRO}s antes da próxima tentativa..."
              sleep "$ESPERA_ERRO"
            fi
            tentativa=$((tentativa + 1))
          done
          echo "Todas as tentativas falharam."
          exit 1

      - name: Upload dos arquivos gerados / erro
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tableau-agendamentos-output
          path: tableau-agendamentos/downloads/**
          if-no-files-found: ignore

      - name: Registrar sucesso no status diário (só na 1ª execução do dia, 08h BRT)
        if: success()
        working-directory: ${{ github.workspace }}
        run: |
          HORA_BRT=$(TZ="America/Sao_Paulo" date +%H)
          if [ "$HORA_BRT" != "08" ]; then
            echo "Não é a primeira execução do dia (hora atual: ${HORA_BRT}h BRT) — pulando registro de status, senão o 'Tableau (1ª execução)' do resumo diário ficaria sendo sobrescrito a cada hora."
            exit 0
          fi
          bash scripts/commit_status.sh tableau_primeira_execucao sucesso

      - name: Notificar falha no WhatsApp
        if: failure()
        run: |
          MSG="⚠️ ${{ github.workflow }} falhou. Ver: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -sS -G "https://api.callmebot.com/whatsapp.php" \
            --data-urlencode "phone=${{ secrets.CALLMEBOT_PHONE }}" \
            --data-urlencode "apikey=${{ secrets.CALLMEBOT_APIKEY }}" \
            --data-urlencode "text=$MSG" \
            || echo "Aviso: falha ao enviar notificação no WhatsApp (não interrompe o workflow)."

      - name: Registrar falha no status diário (só na 1ª execução do dia, 08h BRT)
        if: failure()
        working-directory: ${{ github.workspace }}
        run: |
          HORA_BRT=$(TZ="America/Sao_Paulo" date +%H)
          if [ "$HORA_BRT" != "08" ]; then
            echo "Não é a primeira execução do dia (hora atual: ${HORA_BRT}h BRT) — o campo 'Tableau (1ª execução)' só reflete o resultado das 08h."
            exit 0
          fi
          bash scripts/commit_status.sh tableau_primeira_execucao falha
