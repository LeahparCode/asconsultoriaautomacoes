name: Tableau - Relatorio de Agendamentos

on:
  schedule:
    # Baseado no Controlador.py: roda de hora em hora, das 08h às 18h (Brasília,
    # UTC-3), de segunda a sábado — mantém o relatório sempre atualizado durante
    # o expediente, em vez de rodar uma vez só.
    # Cron do GitHub Actions é sempre em UTC -> 08h-18h BRT = 11h-21h UTC.
    # dia-da-semana "1-6" = segunda a sábado (0/7 seriam domingo).
    - cron: "0 11-21 * * 1-6"
  workflow_dispatch: {}

jobs:
  tableau-agendamentos:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tableau-agendamentos
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Rodar automação (com retentativas, igual ao Controlador.py)
        env:
          TABLEAU_EMAIL: ${{ secrets.TABLEAU_EMAIL }}
          TABLEAU_SENHA: ${{ secrets.TABLEAU_SENHA }}
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_FOLDER_TABLEAU_ID: ${{ secrets.GDRIVE_FOLDER_TABLEAU_ID }}
          GDRIVE_IMPERSONATE_USER: ${{ secrets.GDRIVE_IMPERSONATE_USER }}
        run: |
          MAX_TENTATIVAS=3
          ESPERA_ERRO=60
          tentativa=1
          while [ "$tentativa" -le "$MAX_TENTATIVAS" ]; do
            echo "Tentativa $tentativa de $MAX_TENTATIVAS..."
            if python tableau_agendamentos.py --headless; then
              echo "Execução concluída com sucesso."
              exit 0
            fi
            echo "Falhou na tentativa $tentativa."
            if [ "$tentativa" -lt "$MAX_TENTATIVAS" ]; then
              echo "Aguardando ${ESPERA_ERRO}s antes da próxima tentativa..."
              sleep "$ESPERA_ERRO"
            fi
            tentativa=$((tentativa + 1))
          done
          echo "Todas as tentativas falharam."
          exit 1

      - name: Upload dos arquivos gerados / erro
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tableau-agendamentos-output
          path: tableau-agendamentos/downloads/**
          if-no-files-found: ignore
