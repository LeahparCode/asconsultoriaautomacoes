name: Power BI Export + Importacao RedeService

on:
  # Reativado (19/08/2026): repositório passou a ser público, então o
  # GitHub Actions roda ilimitado e sem custo. Agendamento automático
  # segue pausado (só manual); pra reativar, descomente o bloco
  # "schedule:" abaixo (horário: 07:53 BRT, todos os dias = "53 10 * * *").
  # schedule:
  #   - cron: "53 10 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  pbi-export:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pbi-export-redeservice
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Google Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar automação (com retentativas, igual ao ControladorPBI.py)
        env:
          PBI_LOGIN_EMAIL: ${{ secrets.PBI_LOGIN_EMAIL }}
          PBI_SENHA: ${{ secrets.PBI_SENHA }}
          RS_LOGIN: ${{ secrets.RS_LOGIN }}
          RS_SENHA: ${{ secrets.RS_SENHA }}
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_FOLDER_PBI_ID: ${{ secrets.GDRIVE_FOLDER_PBI_ID }}
          GDRIVE_IMPERSONATE_USER: ${{ secrets.GDRIVE_IMPERSONATE_USER }}
          GDRIVE_OAUTH_CLIENT_ID: ${{ secrets.GDRIVE_OAUTH_CLIENT_ID }}
          GDRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.GDRIVE_OAUTH_CLIENT_SECRET }}
          GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.GDRIVE_OAUTH_REFRESH_TOKEN }}
        run: |
          MAX_TENTATIVAS=3
          ESPERA_ERRO=300
          tentativa=1
          while [ "$tentativa" -le "$MAX_TENTATIVAS" ]; do
            echo "Tentativa $tentativa de $MAX_TENTATIVAS..."
            if python pbi_export.py; then
              echo "Execução concluída com sucesso."
              exit 0
            fi
            echo "Falhou na tentativa $tentativa."
            if [ "$tentativa" -lt "$MAX_TENTATIVAS" ]; then
              echo "Aguardando ${ESPERA_ERRO}s antes da próxima tentativa..."
              sleep "$ESPERA_ERRO"
            fi
            tentativa=$((tentativa + 1))
          done
          echo "Todas as tentativas falharam."
          exit 1

      # "Upload de artefatos (planilhas geradas)" removido (19/08/2026): o
      # repositório é público a partir de agora, e esse artefato continha as
      # planilhas de Inadimplência/Relacionamento/Vendas (CPF, nome, dívida)
      # de clientes reais — dado pessoal de terceiros, baixável por qualquer
      # um em repo público. Os relatórios continuam indo pro Google Drive
      # normalmente (GDRIVE_FOLDER_PBI_ID).
      #
      # Pelo mesmo motivo, o diagnóstico de erro (screenshot + HTML da
      # página) também deixou de subir como artefato público — a página do
      # RedeService mostra dado de importação de clientes na tela. Em caso
      # de falha, os arquivos erro_*.png/erro_*.html continuam sendo
      # gerados no runner; peça pra eu ler o log da execução se precisar
      # investigar.

      - name: Registrar sucesso no status diário (com contagens das bases)
        if: success()
        working-directory: ${{ github.workspace }}
        run: |
          bash scripts/commit_status.sh pbi sucesso --contagens pbi-export-redeservice/contagens.json

      - name: Notificar falha no WhatsApp
        if: failure()
        run: |
          MSG="⚠️ ${{ github.workflow }} falhou. Ver: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -sS -G "https://api.callmebot.com/whatsapp.php" \
            --data-urlencode "phone=${{ secrets.CALLMEBOT_PHONE }}" \
            --data-urlencode "apikey=${{ secrets.CALLMEBOT_APIKEY }}" \
            --data-urlencode "text=$MSG" \
            || echo "Aviso: falha ao enviar notificação no WhatsApp (não interrompe o workflow)."

      - name: Registrar falha no status diário
        if: failure()
        working-directory: ${{ github.workspace }}
        run: |
          bash scripts/commit_status.sh pbi falha
